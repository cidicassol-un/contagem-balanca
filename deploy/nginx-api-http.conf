
# =========================================================
# Contagem Pintinhos API - api.icassol.tech (etapa 1: HTTP)
# Anexado ao nginx.conf do proxy dental_nginx.
# Aplicacao Node roda no host via pm2, porta 3000;
# 172.18.0.1 e o gateway da rede dentalcompara_internal,
# ou seja, como o container enxerga o host.
# =========================================================
upstream pintinhos_backend {
    server 172.18.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.icassol.tech;

    # Validacao do Let's Encrypt (mesmo webroot usado pelo dentalcompara)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://pintinhos_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
