
# =========================================================
# Contagem Pintinhos API - api.icassol.tech (etapa 2: HTTPS)
# Substitui o arquivo da etapa 1 depois que o certificado
# de api.icassol.tech ja existe no volume certbot_certs.
# =========================================================
upstream pintinhos_backend {
    server 172.18.0.1:3000;
    keepalive 16;
}

# HTTP: validacao do certificado e redirecionamento para HTTPS
server {
    listen 80;
    server_name api.icassol.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name api.icassol.tech;

    ssl_certificate     /etc/letsencrypt/live/api.icassol.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.icassol.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/pintinhos_access.log;
    error_log  /var/log/nginx/pintinhos_error.log;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_pass         http://pintinhos_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
